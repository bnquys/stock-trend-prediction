# ================================================================
# RL Trading
# ================================================================
project:
  seed: 42

data:
  paths:
    - "data/VNM.csv"
    - "data/FPT.csv"
    - "data/VIC.csv"
    - "data/HPG.csv"
  source: "VCI"

split:
  train_ratio: 0.8   
  val_ratio:   0.1  

env:
  window:       20
  initial_cap:  1_000_000_000   # 1 tỷ VND
  tx_cost:      0.0015          # 0.15% phí mua/bán
  sell_tax:     0.001           # 0.1% thuế bán (HOSE)
  slippage:     0.001           # 0.1% slippage thực tế

  # ── ATR-based Dynamic SL/TP ──────────────────────────────────
  # SL = entry_price - atr_sl_mult × ATR(14)
  # TP vô hiệu hóa để agent tự quyết định dựa trên kỹ thuật
  atr_sl_mult:  2.0             # Cắt lỗ chặt chẽ hơn (2.0 ATR)
  atr_tp_mult:  3.0             # TP động theo ATR để agent học exit có mục tiêu
  risk_per_trade: 0.02

  # Fallback
  stop_loss:    0.07            # Cắt lỗ tối đa 7%
  take_profit:  0.15            # Chốt lời fallback 15%

  max_hold:     90              # Tăng lên 90 phiên (3 tháng) để gồng trend dài
  t_plus:       2
  trailing_stop_profit: 0.05    # Chỉ kích hoạt trailing stop khi đã lãi > 5%
  drawdown_penalty: 0.05        # Phạt drawdown 3 phiên liên tiếp
  buy_quality_gate: 0.30        # Chặn các setup mua rất yếu
  buy_quality_target: 0.55      # Setup tốt hơn mức này được thưởng nhẹ
  min_expected_edge: 0.012      # Biên kỳ vọng tối thiểu sau phí/slippage
  lot_size:     100             # 1 lô = 100 cp (HOSE)
  price_limit:  0.07            # ±7% trần/sàn HOSE
  inactivity_penalty: 0.0     # Phạt mỗi bước đứng ngoài thị trường quá lâu (>5 steps)

agent:
  hidden:       [256, 128, 64]  
  lr:           0.0001          # Tăng lại LR để Agent nhanh chóng nhận diện tín hiệu mới
  lr_decay:     0.996           
  lr_min:       0.00002         
  gamma:        0.99            # Nhìn cân bằng giữa reward ngắn hạn và giữ trend
  tau:          0.005           
  eps_start:    1.0
  eps_end:      0.1             
  eps_decay:    0.99            
  buffer_cap:   100000          
  batch_size:   256             
  warmup:       2000            
  weight_decay: 0.0002          # Tăng lại weight decay để Model chắc chắn hơn

  n_episodes:   200
  patience:     50             
  checkpoint_every: 50
  learn_every:  4               

output:
  model_dir:  "models"
  log_dir:    "logs"
  chart_dir:  "outputs"
  dpi:        150
